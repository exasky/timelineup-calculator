<header class="sticky top-0 z-50 border-b border-white/10 bg-[#101614]/95 backdrop-blur-xl">
  <div
    class="mx-auto grid max-w-[1500px] gap-3 px-4 py-3 sm:px-6 lg:grid-cols-[1fr_auto_1fr] lg:items-center lg:px-10"
  >
    <a
      class="flex items-center gap-3 self-center no-underline"
      href="#/"
      aria-label="TimelineUp build planner"
    >
      <span
        class="brand-mark grid h-9 w-9 place-items-center rounded-md border border-emerald-200/30 bg-emerald-300/10 text-xs font-bold text-emerald-200"
        >TU</span
      >
      <span class="leading-tight">
        <span class="block font-display text-lg font-bold uppercase tracking-[0.08em] text-white"
          >Timeline<span class="text-emerald-300">Up</span></span
        >
        <span class="block text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500"
          >Build calculator</span
        >
      </span>
    </a>

    <div
      class="power-display flex items-center justify-between gap-3 rounded-md border border-emerald-200/15 bg-emerald-300/[0.06] px-4 py-2 lg:min-w-[260px] lg:justify-center lg:border-0 lg:bg-transparent"
    >
      <span class="text-[10px] font-bold uppercase tracking-[0.16em] text-slate-400 lg:hidden"
        >Total power</span
      >
      <div class="flex items-baseline gap-2">
        <span
          class="hidden text-[10px] font-bold uppercase tracking-[0.16em] text-slate-500 lg:block"
          >Total power</span
        >
        <strong class="power-number text-3xl font-bold leading-none text-emerald-200 sm:text-4xl">{{
          totalPower() | number: '1.0-0'
        }}</strong>
        <span
          class="rounded border border-emerald-200/20 px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-[0.12em] text-emerald-200/80"
          >EST.</span
        >
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-start gap-2 sm:justify-end">
      <p class="min-h-4 w-full text-right text-xs text-emerald-200" aria-live="polite">
        {{ shareStatus() }}
      </p>
      <button
        class="action-button border border-white/10 bg-white/[0.04] text-slate-300 hover:border-white/20 hover:bg-white/[0.08]"
        type="button"
        (click)="resetBuild.emit()"
      >
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" class="h-4 w-4">
          <path
            d="M4 6.5A6.5 6.5 0 1 1 3.5 11M4 3.5v3h3"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Reset build</span>
      </button>
      <button
        class="action-button border border-amber-200/20 bg-amber-200/[0.07] text-amber-100 hover:border-amber-100/40 hover:bg-amber-200/[0.12]"
        type="button"
        (click)="maxAllLevels.emit()"
      >
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" class="h-4 w-4">
          <path
            d="M10 15V5m0 0L6.5 8.5M10 5l3.5 3.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Max all</span>
      </button>
      <button
        class="action-button border border-emerald-200/30 bg-emerald-300 text-[#10211a] hover:bg-emerald-200"
        type="button"
        (click)="saveShare.emit()"
      >
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" class="h-4 w-4">
          <path
            d="M10 13.5V3.75m0 0L6.5 7.25M10 3.75l3.5 3.5M4 12.5v3A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-3"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Save / share</span>
      </button>
    </div>
  </div>
</header>
